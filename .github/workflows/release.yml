name: Release

# Pushing a tag such as v0.1.0 builds gen5 for Windows and attaches it to a
# draft release of that tag, to review and publish by hand.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Put gcc on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - name: Check that the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} does not match version $version in Cargo.toml"
          }

      # One test at a time: the GPU tests share the runner's software
      # renderer, which can crash when several start devices at once.
      - run: cargo test --release --locked -- --test-threads=1
      - run: cargo build --release --locked

      - name: Package
        id: package
        shell: pwsh
        run: |
          $name = "gen5-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/gen5.exe, README.md, LICENSE-MIT, LICENSE-APACHE $name
          Copy-Item -Recurse docs (Join-Path $name docs)
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          "name=$name" | Out-File -Encoding utf8 -Append $env:GITHUB_OUTPUT

      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "${{ steps.package.outputs.name }}"
          gh release create "${{ github.ref_name }}" "$name.zip" "$name.zip.sha256" `
            --draft --verify-tag --generate-notes --title "gen5 ${{ github.ref_name }}"
