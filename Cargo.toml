[package]
name = "gen5"
version = "0.1.0"
edition = "2024"
description = "A native Rust foundation for exploring and importing Pokémon Gen V game data"

[dependencies]
bytemuck = { version = "1.22", features = ["derive"] }
egui = "0.37.0"
egui-wgpu = { version = "0.37.0", features = ["winit"] }
egui-winit = "0.37.0"
glam = { version = "0.34.1", features = ["serde"] }
gilrs = "0.11.2"
kira = "0.12.5"
pollster = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wgpu = "30.0.1"
winit = "0.30.13"
