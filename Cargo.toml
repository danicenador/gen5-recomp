[package]
name = "gen5"
version = "0.1.0"
edition = "2024"
description = "A static recompiler and Nintendo DS runtime for Pokémon Gen V"

[dependencies]
bytemuck = { version = "1.22", features = ["derive"] }
libloading = "0.8.9"
cpal = "0.18.2"
pollster = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wgpu = "30.0.1"
winit = "0.30.13"
rayon = "1.12.0"
